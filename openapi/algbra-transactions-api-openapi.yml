    PartnerTransactionProgressPayload:
      type: object
      properties:
        event:
          type: string
          description: Progress event type for the transaction
          enum:
          - EXPECTED_INBOUND
          - EXPECTED_OUTBOUND
          - PLATFORM_VERIFIED
          - PAYMENT_VERIFIED
          - COMPLETED
          - CANCELLED
          example: COMPLETED
        date:
          format: date-time
          type: string
          description: Timestamp of when the event occurred
          example: '2025-01-01T10:16:49.621Z'
      required:
      - event
      - date
    PartnerTransactionTransferMetadataPayload:
      type: object
      properties:
        rails:
          type:
          - string
          - 'null'
          description: Outbound rails used for the transfer, if applicable
          enum:
          - FASTER_PAYMENTS
          - CHAPS
          - BACS
          - INTERNAL
          - INTERNATIONAL
          example: FASTER_PAYMENTS
        transactionProgress:
          description: Timeline of progress events for this transfer
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PartnerTransactionProgressPayload'
        fundingSourceProvider:
          description: Funding source provider
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentFundingSourceResponse'
        transferType:
          type: string
          enum:
          - OUTBOUND_CONTACT
          - INBOUND_PISP
          - INBOUND_LINK
          - INBOUND_RAILS
          - OUTBOUND_LINK
          - SPLIT_REQUEST
          - CUBE_TRANSFER
          - OUTBOUND_NOMINATED
          - RETURN
        returnReason:
          type: string
          enum:
          - ACCOUNT_SUSPENDED
          - INBOUND_PAYMENTS_RESTRICTED
          - PROVIDER_INITIATED
          - REFUND
          - CUBE_LOCKED_INBOUND_DISALLOWED
        returnExplanation:
          type: string
        automatedPaymentId:
          type: string
          format: uuid
        automatedPaymentType:
          type: string
          enum:
          - DIRECT_DEBIT
    PartnerTransactionResponse:
      type: object
      properties:
        transactionId:
          type: string
          description: Unique identifier of the transaction
          example: 68c2a19131a3b726fe47fdda
        uniqueToken:
          type: string
          format: uuid
          description: Unique token of the transaction
          example: 1489dd60-aa06-48a6-a267-e7d4a9a84200
        origin:
          type: string
          description: Origin of the transaction
          enum:
          - TRANSFER
          - CARD
          - AUTOMATED_PAYMENT
          - INVESTMENTS
          example: TRANSFER
        state:
          type: string
          description: Current state of the transaction
          enum:
          - EXPECTED
          - PENDING
          - COMPLETED
          - CANCELLED
          - FAILED
          example: COMPLETED
        category:
          type: string
          description: Category of the transaction
          enum:
          - GENERAL
          - SHOPPING
          - TRANSFERS
          - EATING_OUT
          - DONATIONS
          - FAMILY
          - CASH
          - ENTERTAINMENT
          - EXPENSES
          - GIFTS
          - GROCERIES
          - HOLIDAYS
          - INVESTMENTS
          - PERSONAL_CARE
          - SALARY
          - SAVINGS
          - SERVICES
          - TRANSPORT
          - UTILITIES
          - CASHBACK_REWARDS
          - REFERRAL_REWARDS
          example:
          - TRANSFERS
        impactType:
