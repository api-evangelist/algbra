openapi: 3.2.0
info:
  title: Horizon Link - API Docs Transactions API
  description: ''
  version: '1.0'
  contact: {}
servers:
- url: api-url
tags:
- name: Transactions
paths:
  /v1/partner/transactions:
    get:
      operationId: TransactionController_getTransactions
      summary: Get transactions
      parameters:
      - name: accountIds
        required: false
        in: query
        description: List of account IDs to filter transactions. If not provided, transactions from all accessible accounts are included.
        example:
        - e0cab2dd-739f-43de-b131-3e423e935bf1
        schema:
          type: array
          items:
            type: string
      - name: fromDate
        required: false
        in: query
        description: 'Start date for filtering transactions (inclusive). Expected format: YYYY-MM-DD. No lower bound if omitted.'
        example: '2025-01-01'
        schema:
          type:
          - string
          - 'null'
      - name: toDate
        required: false
        in: query
        description: 'End date for filtering transactions (inclusive). Expected format: YYYY-MM-DD. No upper bound if omitted.'
        example: '2025-12-31'
        schema:
          type:
          - string
          - 'null'
      - name: origins
        required: false
        in: query
        description: Filter transactions by their origin (e.g., Transfer, Deposit, Withdrawal). Multiple values allowed.
        example:
        - TRANSFER
        - CARD
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - TRANSFER
            - CARD
            - AUTOMATED_PAYMENT
            - INVESTMENTS
      - name: states
        required: false
        in: query
        description: Filter transactions by their state (e.g., Completed, Pending, Failed). Multiple values allowed.
        example:
        - COMPLETED
        - PENDING
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - EXPECTED
            - PENDING
            - COMPLETED
            - CANCELLED
            - FAILED
      - name: transactionAccountIncludeTypes
        required: false
        in: query
        description: Filter transactions by their account include type (e.g., Customer account, Program account). Multiple values allowed.
        example:
        - CUSTOMER_ACCOUNT
        - PROGRAM_ACCOUNT
        schema:
          default:
          - CUSTOMER_ACCOUNT
          - PROGRAM_ACCOUNT
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - CUSTOMER_ACCOUNT
            - PROGRAM_ACCOUNT
      - name: page
        required: true
        in: query
        description: Page number for paginated results. Starts from 1.
        example: 1
        schema:
          default: 1
          type: number
      - name: limit
        required: true
        in: query
        description: Number of transactions per page. Maximum allowed value is 100.
        example: 10
        schema:
          maximum: 100
          default: 10
          type: number
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/PartnerTransactionResponse'
                    meta:
                      type: object
                      properties:
                        currentPage:
                          type: number
                          example: 1
                        itemCount:
                          type: number
                          example: 10
                        itemsPerPage:
                          type: number
                          example: 10
                        totalItems:
                          type: number
                          example: 100
                        totalPages:
                          type: number
                          example: 10
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Transactions
  /v1/partner/transactions/{transactionId}:
    get:
      operationId: TransactionController_getTransaction
      summary: Get transaction
      parameters:
      - name: transactionId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerTransactionResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Transactions
