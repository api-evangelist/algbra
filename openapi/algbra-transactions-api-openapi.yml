          example: ENTERED
        cardPresent:
          type: boolean
          description: Indicates if the card was physically present
          example: true
        pinPresent:
          type: boolean
          description: Indicates if PIN was entered
          example: false
        partialApprovalCapable:
          type: boolean
          description: Indicates if partial approval is capable
          example: false
        purchaseAmountOnly:
          type: boolean
          description: Indicates if this is purchase amount only
          example: true
        isRecurring:
          type: boolean
          description: Indicates if this is a recurring transaction
          example: false
        isInstallment:
          type: boolean
          description: Indicates if this is an installment transaction
          example: false
        cardHolderPresent:
          type: boolean
          description: Indicates if cardholder was present
          example: true
        countryCode:
          type: string
          description: Country code (ISO 3166-1 alpha-2)
          example: GB
        postCode:
          type: string
          description: Postal code
          example: SW1A 1AA
        terminalAttendence:
          type: string
          description: Terminal attendance indicator
          example: ATTENDED
        terminalId:
          type: string
          description: Terminal identifier
          example: TERM001
        terminalLocation:
          type: string
          description: Terminal location
          example: IN_STORE
