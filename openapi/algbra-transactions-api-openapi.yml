    PartnerPaymentDomesticCounterpartyPayload:
      type: object
      properties:
        sortCode:
          type: string
          description: UK domestic bank sort code.
          example: '010102'
        accountNumber:
          type: string
          description: UK domestic bank account number.
          example: '12345678'
      required:
      - sortCode
      - accountNumber
    PartnerTransactionInvestmentMetadataPayload:
      type: object
      properties:
        collectionDate:
          format: date-time
          type: string
          description: Collection date
          example: '2026-03-31T16:09:33.671Z'
        placementDate:
          format: date-time
          type: string
          description: Placement date
          example: '2026-04-02T00:00:00.000Z'
        maturityDate:
          format: date-time
          type: string
          description: Maturity date
          example: '2026-10-02T12:00:00.000Z'
        settlementDate:
          format: date-time
          type: string
          description: Settlement date
          example: '2026-10-02T18:00:00.000Z'
        subscriptionId:
          type: string
          description: Subscription id
          example: add57586-1ed7-4374-9e56-c62f17fe2426
          format: uuid
        productVariantId:
          type: string
          description: Product variant id
          example: 6929c0f8a3fc67ff7fa8ecd1
        reason:
          type: string
          description: Reason
          enum:
          - COLLECTION
          - PLACEMENT
          - SETTLEMENT
          - EXPECTED_RETURN
          - CANCEL_EXPECTED_RETURN
          - ACTUAL_RETURN
          example: COLLECTION
        returns:
          type: number
          description: Expected return amount in minor units (e.g. 129 for £1.29)
          example: 129
      required:
      - collectionDate
      - placementDate
      - maturityDate
      - settlementDate
      - subscriptionId
      - productVariantId
      - reason
      - returns
