          type: array
          items:
            type: string
        mid:
          type: string
          description: Merchant identifier
          example: MID123456
        mcc:
          type: string
          description: Merchant category code
          example: '5411'
        name:
          type: string
          description: Merchant name
          example: Supermarket
        address:
          type: string
          description: Merchant address
          example: 123 Main Street
        city:
          type: string
          description: Merchant city
          example: London
        state:
          type: string
          description: Merchant state or province
          example: Greater London
        postcode:
          type: string
          description: Merchant postal code
          example: SW1A 1AA
        country:
          type: string
          description: Merchant country code (ISO 3166-1 alpha-2)
          example: GB
