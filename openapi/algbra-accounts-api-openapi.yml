openapi: 3.2.0
info:
  title: Horizon Link - API Docs Accounts API
  description: ''
  version: '1.0'
  contact: {}
servers:
- url: api-url
tags:
- name: Accounts
paths:
  /v1/partner/accounts/primary:
    post:
      operationId: AccountController_createPrimaryAccount
      summary: Create a primary account
      parameters:
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreatePrimaryAccountRequest'
      responses:
        '201':
          description: Account successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPrimaryAccountResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Accounts
  /v1/partner/accounts/virtual:
    post:
      operationId: AccountController_createVirtualAccount
      summary: Create a virtual account
      parameters:
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreateVirtualAccountRequest'
      responses:
        '201':
          description: Account successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerVirtualAccountResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: Parent account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '412':
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAccountErrorResponse'
      tags:
      - Accounts
  /v1/partner/accounts:
    get:
      operationId: AccountController_getAllAccounts
      summary: Get all accounts
      parameters:
      - name: types
        required: false
        in: query
        description: List of account type to filter accounts. Multiple types can be specified.
        example:
        - PRIMARY
        schema:
          default:
          - PRIMARY
          - VIRTUAL
          - PROGRAM
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - PRIMARY
            - VIRTUAL
            - PROGRAM
      - name: primaryAccountId
        required: false
        in: query
        description: Primary account ID to filter virtual accounts.
        example: e0cab2dd-739f-43de-b131-3e423e935bf1
        schema:
          format: uuid
          type:
          - string
          - 'null'
      - name: states
        required: false
        in: query
        description: List of account states to filter results.
        example:
        - READY
        schema:
          default:
          - READY
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - INITIALIZING
            - READY
            - BLOCKED
            - CLOSED
            - SUSPENDED
      - name: page
        required: true
        in: query
        description: Page number for paginated results.
        example: 1
        schema:
          default: 1
          type: number
      - name: limit
        required: true
        in: query
        description: Number of accounts per page.
        example: 10
        schema:
          maximum: 100
          default: 10
          type: number
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: List of accounts available to the partner
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - properties:
                    items:
                      type: array
                      items:
                        oneOf:
                        - $ref: '#/components/schemas/PartnerPrimaryAccountResponse'
                        - $ref: '#/components/schemas/PartnerVirtualAccountResponse'
                        - $ref: '#/components/schemas/PartnerProgramAccountResponse'
                    meta:
                      type: object
                      properties:
                        currentPage:
                          type: number
                          example: 1
                        itemCount:
                          type: number
                          example: 10
                        itemsPerPage:
                          type: number
                          example: 10
                        totalItems:
                          type: number
                          example: 100
                        totalPages:
                          type: number
                          example: 10
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAccountErrorResponse'
      tags:
      - Accounts
  /v1/partner/accounts/{accountId}:
    get:
      operationId: AccountController_getAccountById
      summary: Get account
      parameters:
      - name: accountId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: Returns the account details
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PartnerPrimaryAccountResponse'
                - $ref: '#/components/schemas/PartnerVirtualAccountResponse'
                - $ref: '#/components/schemas/PartnerProgramAccountResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAccountErrorResponse'
      tags:
      - Accounts
  /v1/partner/accounts/{accountId}/balance:
    get:
      operationId: AccountController_getAccountBalance
      summary: Get account balance
      parameters:
      - name: accountId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: Returns account real-time balance positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAccountBalanceResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAccountErrorResponse'
      tags:
      - Accounts
  /v1/partner/accounts/virtual/{accountId}:
    delete:
      operationId: AccountController_closeVirtualAccount
      summary: Delete a virtual account
      parameters:
      - name: accountId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerDeleteVirtualAccountRequest'
      responses:
        '200':
          description: Virtual account deleted
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '412':
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAccountErrorResponse'
      tags:
      - Accounts
