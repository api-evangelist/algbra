    PartnerAccountIdentifierResponse:
      type: object
      properties:
        type:
          type: string
          enum:
          - UK_ACCOUNT
          - IBAN
          - CUSTODY_ID
          - OTHER_EXTERNAL
          - GENERIC_ACCOUNT
          example: UK_ACCOUNT
        beneficiary:
          type: string
          description: Beneficiary name
          example: John Doe
        bankAddress:
          type: string
          description: Bank address
          example: Threadneedle St, London EC2R 8AH, United Kingdom
        bankName:
          type: string
          description: Name of the bank issuing the account identifier
          example: Barclays Bank PLC
        data:
          description: Identifiers including Account Number and Sort Code for UK accounts, IBAN for international accounts, or ACH details for US accounts
          oneOf:
          - $ref: '#/components/schemas/PartnerUKAccount'
          - $ref: '#/components/schemas/PartnerIBANAccount'
          - $ref: '#/components/schemas/PartnerCustodyIdAccount'
          - $ref: '#/components/schemas/PartnerOtherExternalAccount'
          - $ref: '#/components/schemas/PartnerGenericAccount'
          examples:
          - type: UK_ACCOUNT
            sortCode: '010102'
            accountNumber: '12345678'
          - type: IBAN
            iban: GB33BUKB20201555555555
            bic: BUKBGB22
            currency: GBP
            country: GBR
          - type: CUSTODY_ID
            id: A0000EXTM
          - type: OTHER_EXTERNAL
            bic: BUKBGB22
            currency: GBP
            country: GBR
            descriptor: AMERICAN INTERNATIONAL GROUP UK LTD
          - type: GENERIC_ACCOUNT
            routingType: ACH_ROUTING_NUMBER
            routingNumber: '021000021'
            accountNumber: 000123456789
            country: USA
            currency: USD
      required:
      - type
      - beneficiary
      - bankAddress
      - data
    PartnerGenericAccount:
