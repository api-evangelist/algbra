    PartnerAutomatedPaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the automated payment.
        type:
          type: string
          enum:
          - DIRECT_DEBIT
          description: Type of automated payment.
        customerId:
          type:
          - string
          - 'null'
          format: uuid
          description: Identifier of the customer that owns the automated payment.
        accountId:
          type: string
          format: uuid
          description: Identifier of the customer's account linked to the automated payment.
        reference:
          type:
          - string
          - 'null'
          description: Partner reference associated with the automated payment instruction.
        amount:
          type:
          - number
          - 'null'
          description: Amount configured for the automated payment, when available.
        state:
          type: string
          enum:
          - IDLE
          - INITIATION_PENDING
          - INITIATED
          - CANCELLATION_PENDING
          - CANCELLED
          description: Current lifecycle state of the automated payment.
        reasonCode:
          type:
          - string
          - 'null'
          description: Reason code associated with the current state, when available. `PAYER_NAME_MISMATCH` indicates the mandate was cancelled because the payer name did not match the account holder.
        createdOn:
          format: date-time
          type: string
          description: Timestamp when the automated payment was created.
        updatedOn:
          format: date-time
          type: string
          description: Timestamp when the automated payment was last updated.
        counterparty:
          description: Counterparty linked to the automated payment instruction.
          allOf:
          - $ref: '#/components/schemas/PartnerAutomatedPaymentCounterpartyResponse'
        metadata:
          description: Partner-safe metadata associated with the automated payment counterparty.
          allOf:
          - $ref: '#/components/schemas/PartnerAutomatedPaymentCounterpartyMetadataResponse'
        payer:
          description: Payer account details reported when the automated payment was set up, when available.
          allOf:
          - $ref: '#/components/schemas/PartnerAutomatedPaymentPayerResponse'
      required:
      - id
      - type
      - accountId
      - state
      - createdOn
      - updatedOn
      - counterparty
      - metadata
    PartnerSimulateDirectDebitMandateRequest:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
          description: Identifier of the customer's account that will be debited by this automated payment.
        reference:
          type: string
          description: Partner reference for the automated payment instruction.
          example: UTILITY-BILL-MAY
        counterparty:
          description: Counterparty account and identity details for the automated payment instruction.
          oneOf:
          - $ref: '#/components/schemas/PartnerPaymentReferenceCounterpartyPayload'
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentReferenceCounterpartyPayload'
        metadata:
          description: Originator metadata used for direct debit setup and partner display.
          allOf:
          - $ref: '#/components/schemas/PartnerAutomatedPaymentCounterpartyMetadataRequest'
      required:
      - accountId
      - reference
      - counterparty
      - metadata
    PartnerCommonErrorResponse:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - VALIDATION_ERROR
          - FORBIDDEN
          - NOT_FOUND
          - UNAUTHORIZED
          - PRECONDITION_FAILED
          - REQUEST_TIMEOUT
          - SERVICE_UNAVAILABLE
          - UNIDENTIFIED
          - TECHNICAL_ERROR
        reason:
          type:
          - string
          - 'null'
        validationFailures:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PartnerValidationFieldError'
      required:
      - errorType
    PartnerUnknownDetailsPayload:
      type: object
      properties:
        name:
          type: string
          description: Name of the counterparty
          example: OperatingAcc
          maxLength: 140
      required:
      - name
    PartnerValidationFieldError:
      type: object
      properties:
        message:
          type: string
        path:
          type:
          - string
          - 'null'
      required:
      - message
    PartnerSimulateDirectDebitPaymentRequest:
      type: object
      properties:
        automatedPaymentId:
          type: string
          format: uuid
          description: Identifier of the automated payment.
        accountId:
          type: string
          format: uuid
          description: Identifier of the customer's account that will receive the simulated collection.
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
        amount:
          type: number
          maxLength: 11
          description: Amount of the simulated direct debit collection in minor units.
          example: 1250
        reference:
          type: string
          maxLength: 18
          description: Reference that will be included in the simulated direct debit record.
          example: MAYUTILITYBILL
      required:
      - automatedPaymentId
      - accountId
      - amount
    PartnerSimulateInboundPaymentPayload:
      type: object
      properties:
        rails:
          type: string
          default: FASTER_PAYMENTS
          description: The payment rail to simulate (e.g. Faster Payments). BACS simulates a Direct Credit or a Direct Debit, chosen by payload.type, into a ClearBank account.
          enum:
          - FASTER_PAYMENTS
          - CHAPS
          - BACS
          - INTERNAL
          - INTERNATIONAL
          example: FASTER_PAYMENTS
        payload:
          description: Simulation details specific to the selected payment rail
          oneOf:
          - $ref: '#/components/schemas/PartnerSimulateFpsPayload'
          - $ref: '#/components/schemas/PartnerSimulateInternationalPayload'
          - $ref: '#/components/schemas/PartnerSimulateBacsPayload'
      required:
      - rails
      - payload
    PartnerPaymentCustodyIdCounterpartyPayload:
      type: object
      properties:
        id:
          type: string
          description: External identifier
          example: A0000EXTM
      required:
      - id
    PartnerAutomatedPaymentPayerResponse:
      type: object
      properties:
        accountName:
          type:
          - string
          - 'null'
          description: Payer account name provided to the originator when the direct debit mandate was set up.
          example: J SMITH
        sortCode:
          type:
          - string
          - 'null'
          description: Sort code of the payer account debited by the automated payment.
          example: '040000'
        accountNumber:
          type:
          - string
          - 'null'
          description: Account number of the payer account debited by the automated payment.
          example: '12345678'
    PartnerPersonalDetailsPayload:
      type: object
      properties:
        firstName:
          type: string
          description: First name of the counterparty.
          example: John
          maxLength: 70
        lastName:
          type: string
          description: Last name of the counterparty.
          example: Doe
          maxLength: 70
      required:
      - firstName
      - lastName
