    PartnerSimulateFpsPayload:
      type: object
      properties:
        sourceCounterparty:
          description: Counterparty details for the payment source
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentReferenceCounterpartyPayload'
        destinationFiatAccountId:
          type: string
          description: Account id of the destination account which receiving the payment
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
          format: uuid
        amount:
          type: number
          description: Amount in minor units (e.g. for £1.29 enter 129)
          example: 129
        reference:
          type:
          - string
          - 'null'
          description: Description of the payment
          example: Sent from Algbra
          maxLength: 140
      required:
      - destinationFiatAccountId
      - amount
    PartnerSimulateInternationalPayload:
      type: object
      properties:
        sourceCounterparty:
          description: Counterparty details for the payment source
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentReferenceCounterpartyPayload'
        destinationFiatAccountId:
          type: string
          description: Account id of the destination account which receiving the payment
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
          format: uuid
        amount:
          type: number
          description: Amount in minor units (e.g. for £1.29 enter 129)
          example: 129
        reference:
          type:
          - string
          - 'null'
          description: Description of the payment
          example: Sent from Algbra
          maxLength: 140
      required:
      - destinationFiatAccountId
      - amount
    PartnerSimulateBacsPayload:
      type: object
      properties:
        type:
          type: string
          enum:
          - DIRECT_CREDIT
          - DIRECT_DEBIT
          description: DIRECT_CREDIT credits the account. DIRECT_DEBIT collects from it under the mandate given in automatedPaymentId.
          example: DIRECT_CREDIT
        destinationFiatAccountId:
          type: string
          description: Account id of the destination account which receiving the payment
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
          format: uuid
        amount:
          type: number
          description: Amount in minor units (e.g. for £1.29 enter 129)
          minimum: 1
          maximum: 99999999999
          example: 15000
        reference:
          type: string
          description: 'Reference of the BACS item: uppercase letters, numbers, period, ampersand, forward slash, hyphen and space. Generated when omitted.'
          maxLength: 18
          example: SALARY OCT
        sourceCounterparty:
          description: DIRECT_CREDIT only. The originator (payer), a UK account. Defaults to a test originator the ClearBank simulator accepts.
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentReferenceCounterpartyPayload'
        serviceUserNumber:
          type: string
          description: DIRECT_CREDIT only. BACS service user number of the originator.
          minLength: 6
          maxLength: 6
          default: '400000'
          example: '400000'
        automatedPaymentId:
          type: string
          description: DIRECT_DEBIT only, and required for it. The mandate the collection is made under; its originator and service user number are used.
          format: uuid
      required:
      - type
      - destinationFiatAccountId
      - amount
    PartnerSimulateDirectCreditPaymentRequest:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
          description: Identifier of the customer's account that will receive the simulated direct credit.
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
        amount:
          type: number
          minimum: 1
          maximum: 99999999999
          description: Amount of the simulated direct credit in minor units (e.g. for £1.29 enter 129).
          example: 15000
        reference:
          type: string
          maxLength: 18
          description: Reference that will be included in the simulated direct credit record. Generated when omitted.
          example: SALARY OCT
        originatorName:
          type: string
          maxLength: 18
          description: Name of the originator (payer) account.
          default: HORIZON SIMULATION
          example: ACME LTD
        originatorSortCode:
          type: string
          minLength: 6
          maxLength: 6
          description: Sort code of the originator (payer) account.
          default: '400516'
          example: '400516'
        originatorAccountNumber:
          type: string
          minLength: 8
          maxLength: 8
          description: Account number of the originator (payer) account.
          default: '12345678'
          example: '12345678'
        serviceUserNumber:
          type: string
          minLength: 6
          maxLength: 6
          description: BACS service user number of the originator.
          default: '400000'
          example: '400000'
      required:
      - accountId
      - amount
