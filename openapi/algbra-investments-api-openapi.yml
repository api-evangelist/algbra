openapi: 3.2.0
info:
  title: Horizon Link - API Docs Investments API
  description: ''
  version: '1.0'
  contact: {}
servers:
- url: api-url
tags:
- name: Investments
paths:
  /v1/partner/investments/product-variants:
    get:
      operationId: InvestmentController_getProductVariants
      summary: Get all product variants
      parameters:
      - name: page
        required: true
        in: query
        description: Page number for paginated results.
        example: 1
        schema:
          default: 1
          type: number
      - name: limit
        required: true
        in: query
        description: Number of product variants per page.
        example: 10
        schema:
          maximum: 100
          default: 10
          type: number
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: List of product variants available to the partner
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/PartnerProductVariantResponse'
                    meta:
                      type: object
                      properties:
                        currentPage:
                          type: number
                          example: 1
                        itemCount:
                          type: number
                          example: 10
                        itemsPerPage:
                          type: number
                          example: 10
                        totalItems:
                          type: number
                          example: 100
                        totalPages:
                          type: number
                          example: 10
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Investments
  /v1/partner/investments/product-variants/{productVariantId}:
    get:
      operationId: InvestmentController_getProductVariant
      summary: Get product variant
      parameters:
      - name: productVariantId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: Returns the product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProductVariantResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Investments
  /v1/partner/investments/subscriptions:
    get:
      operationId: InvestmentController_getSubscriptions
      summary: Get all subscriptions
      parameters:
      - name: page
        required: true
        in: query
        description: Page number for paginated results.
        example: 1
        schema:
          minimum: 1
          default: 1
          type: number
      - name: limit
        required: true
        in: query
        description: Number of subscriptions per page.
        example: 10
        schema:
          minimum: 1
          maximum: 100
          default: 10
          type: number
      - name: customerIds
        required: true
        in: query
        description: Filter by customerIds.
        example:
        - a2b9649e-df7f-4349-adff-1c57283fef10
        schema:
          type: array
          items:
            type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: List of subscriptions available to the partner
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/PartnerSubscriptionResponse'
                    meta:
                      type: object
                      properties:
                        currentPage:
                          type: number
                          example: 1
                        itemCount:
                          type: number
                          example: 10
                        itemsPerPage:
                          type: number
                          example: 10
                        totalItems:
                          type: number
                          example: 100
                        totalPages:
                          type: number
                          example: 10
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Investments
    post:
      operationId: InvestmentController_subscribeToProduct
      summary: Create subscription
      parameters:
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreateSubscriptionRequest'
      responses:
        '201':
          description: Returns the subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerSubscriptionResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Investments
  /v1/partner/investments/subscriptions/{subscriptionId}:
    get:
      operationId: InvestmentController_getSubscription
      summary: Get subscription
      parameters:
      - name: subscriptionId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: Returns the subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerSubscriptionResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Investments
  /v1/partner/investments/product-variants/{productVariantId}/returns:
    get:
      operationId: InvestmentController_getProductVariantReturns
      summary: Get product variant returns
      parameters:
      - name: productVariantId
        required: true
        in: path
        schema:
          type: string
      - name: amount
        required: true
        in: query
        description: Amount in minor units (e.g. 129 for £1.29)
        example: 10000
        schema:
          type: number
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: Returns calculated product return details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProductVariantReturnsResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '412':
          description: Amount lower than product's minimum amount. Try greater value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Investments
