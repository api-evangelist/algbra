    PartnerBusinessScheduleWorkingDaysOfWeekResponse:
      type: object
      properties:
        monday:
          type: boolean
          example: true
          description: Monday of week
        tuesday:
          type: boolean
          example: true
          description: Tuesday of week
        wednesday:
          type: boolean
          example: true
          description: Wednesday of week
        thursday:
          type: boolean
          example: true
          description: Thursday of week
        friday:
          type: boolean
          example: true
          description: Friday of week
        saturday:
          type: boolean
          example: false
          description: Saturday of week
        sunday:
          type: boolean
          example: false
          description: Sunday of week
      required:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
    PartnerProductPlanetImpactResponse:
      type: object
      properties:
        co2AvoidanceRatio:
          type: number
          example: 0.25
          description: Carbon avoidance ratio
        cleanWaterImpactRatio:
          type: number
          example: 0.4
          description: Clean water generation ratio
      required:
      - co2AvoidanceRatio
      - cleanWaterImpactRatio
    PartnerValidationFieldError:
      type: object
      properties:
        message:
          type: string
        path:
          type:
          - string
          - 'null'
      required:
      - message
    PartnerProductActivityProvisionResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        reason:
          $ref: '#/components/schemas/Error'
        paymentId:
          type: string
          example: 1489dd60-aa06-48a6-a267-e7d4a9a84200
          format: uuid
      required:
      - success
    PartnerCreateSubscriptionRequest:
      type: object
      properties:
        customerId:
          type: string
          description: Customer ID that will be the account owner.
          example: a2b9649e-df7f-4349-adff-1c57283fef10
          format: uuid
        idempotencyKey:
          type: string
          description: A unique idempotency key to prevent duplicate subscription.
          example: 1483d25d-3f00-4d39-90ce-2379a130becd
          format: uuid
        externalReference:
          type:
          - string
          - 'null'
          description: Reference identifier provided by partner.
          example: ae588135-0391-42a8-a4e4-e8e7645fa707
          format: uuid
        primaryAccountId:
          type: string
          description: The primary account id under which the virtual account will be created.
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
          format: uuid
        productVariantId:
          type: string
          description: The product variant id which will be subscribed.
          example: 6929c0f8a3fc67ff7fa8ecd1
        amount:
          type: number
          description: Amount in minor units (e.g. 129 for £1.29)
          example: 129
      required:
      - customerId
      - idempotencyKey
      - primaryAccountId
      - productVariantId
      - amount
    PartnerProductActivityResponse:
      type: object
      properties:
        id:
          type: string
          example: 4fc0b733-9bc0-48dc-9fcd-e28ed85a6dd7
          description: Unique identifier of the activity
          format: uuid
        phase:
          type: string
          description: Phase
          enum:
          - FUNDS_COLLECTION
          - FUNDS_PLACEMENT
          - FUNDS_SETTLEMENT
          - EARLY_WITHDRAWAL
          example: FUNDS_COLLECTION
        processingStatus:
          type: string
          description: Processing status
          enum:
          - INITIALIZED
          - ACCEPTED
          - FAILED
          - REINITIALIZED
          example: INITIALIZED
        provisionRequest:
          description: Provision request
          type: array
          items:
            $ref: '#/components/schemas/PartnerProductActivityProvisionRequest'
        provisionResult:
          description: Provision result
          type: array
          items:
            $ref: '#/components/schemas/PartnerProductActivityProvisionResult'
        createDate:
          format: date-time
          type: string
          description: Create date
          example: '2026-04-13T14:39:42.464Z'
      required:
      - id
      - phase
      - processingStatus
      - createDate
