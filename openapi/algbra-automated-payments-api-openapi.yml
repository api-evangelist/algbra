    PartnerAutomatedPaymentStateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the automated payment state record.
        state:
          type: string
          enum:
          - IDLE
          - INITIATION_PENDING
          - INITIATED
          - CANCELLATION_PENDING
          - CANCELLED
          description: Lifecycle state recorded for the automated payment.
        createdOn:
          format: date-time
          type: string
          description: Timestamp when this automated payment state was recorded.
        automatedPaymentId:
          type: string
          format: uuid
          description: Identifier of the automated payment this state belongs to.
        reasonCode:
          type:
          - string
          - 'null'
          description: Optional reason code associated with this state transition.
      required:
      - id
      - state
      - createdOn
      - automatedPaymentId
    PartnerRevokeAutomatedPaymentRequest:
      type: object
      properties:
        reasonCode:
          type: string
          enum:
          - INSTITUTION_CANCELLED_REFER_TO_PAYER
          - CANCELLED_BY_PAYER
          - PAYER_DECEASED
          - ACCOUNT_CLOSED
          description: Reason code explaining why the automated payment should be revoked.
        idempotencyKey:
          type: string
          format: uuid
          description: Unique idempotency key to prevent duplicate revoke requests.
      required:
      - reasonCode
      - idempotencyKey
