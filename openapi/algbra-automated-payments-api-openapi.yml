openapi: 3.2.0
info:
  title: Horizon Link - API Docs Automated Payments API
  description: ''
  version: '1.0'
  contact: {}
servers:
- url: api-url
tags:
- name: Automated Payments
paths:
  /v1/partner/automated-payments/customers/{customerId}:
    get:
      operationId: AutomatedPaymentController_getCustomerAutomatedPayments
      summary: Get customer automated payments
      parameters:
      - name: customerId
        required: true
        in: path
        schema:
          type: string
      - name: stateTypes
        required: true
        in: query
        schema:
          type: array
          items:
            type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerAutomatedPaymentResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Automated Payments
  /v1/partner/automated-payments/customers/{customerId}/{automatedPaymentId}:
    get:
      operationId: AutomatedPaymentController_getCustomerAutomatedPaymentById
      summary: Get customer automated payment
      parameters:
      - name: customerId
        required: true
        in: path
        schema:
          type: string
      - name: automatedPaymentId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAutomatedPaymentResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Automated Payments
    delete:
      operationId: AutomatedPaymentController_revokeCustomerAutomatedPayment
      summary: Revoke customer automated payment
      parameters:
      - name: customerId
        required: true
        in: path
        schema:
          type: string
      - name: automatedPaymentId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerRevokeAutomatedPaymentRequest'
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Automated Payments
  /v1/partner/automated-payments/customers/{customerId}/{automatedPaymentId}/states:
    get:
      operationId: AutomatedPaymentController_getCustomerAutomatedPaymentStates
      summary: Get customer automated payment states
      parameters:
      - name: customerId
        required: true
        in: path
        schema:
          type: string
      - name: automatedPaymentId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerAutomatedPaymentStateResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Automated Payments
  /v1/partner/automated-payments/accounts/{accountId}:
    get:
      operationId: AutomatedPaymentController_getAccountAutomatedPayments
      summary: Get account automated payments
      parameters:
      - name: accountId
        required: true
        in: path
        schema:
          type: string
      - name: stateTypes
        required: true
        in: query
        schema:
          type: array
          items:
            type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerAutomatedPaymentResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Automated Payments
components:
  schemas:
    PartnerValidationFieldError:
      type: object
      properties:
        message:
          type: string
        path:
          type:
          - string
          - 'null'
      required:
      - message
    PartnerAutomatedPaymentCounterpartyMetadataResponse:
      type: object
      properties:
        serviceUserNumber:
          type: string
          description: BACS service user number associated with the direct debit originator.
        name:
          type:
          - string
          - 'null'
          description: Originator display name associated with the automated payment.
        logo:
          type:
          - string
          - 'null'
          description: Optional logo URL resolved for the automated payment counterparty.
        category:
          type:
          - string
          - 'null'
          enum:
          - GENERAL
          - SHOPPING
          - TRANSFERS
          - EATING_OUT
          - DONATIONS
          - FAMILY
          - CASH
          - ENTERTAINMENT
          - EXPENSES
          - GIFTS
          - GROCERIES
          - HOLIDAYS
          - INVESTMENTS
          - PERSONAL_CARE
          - SALARY
          - SAVINGS
          - SERVICES
          - TRANSPORT
          - UTILITIES
          - CASHBACK_REWARDS
          - REFERRAL_REWARDS
          description: Optional transaction category inferred for the automated payment counterparty.
      required:
      - serviceUserNumber
    PartnerAutomatedPaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the automated payment.
        type:
          type: string
          enum:
          - DIRECT_DEBIT
          description: Type of automated payment.
        customerId:
          type:
          - string
          - 'null'
          format: uuid
          description: Identifier of the customer that owns the automated payment.
        accountId:
          type: string
          format: uuid
          description: Identifier of the customer's account linked to the automated payment.
        reference:
          type:
          - string
          - 'null'
          description: Partner reference associated with the automated payment instruction.
        amount:
          type:
          - number
          - 'null'
          description: Amount configured for the automated payment, when available.
        state:
          type: string
          enum:
          - IDLE
          - INITIATION_PENDING
          - INITIATED
          - CANCELLATION_PENDING
          - CANCELLED
          description: Current lifecycle state of the automated payment.
        reasonCode:
          type:
          - string
          - 'null'
          description: Reason code associated with the current state, when available. `PAYER_NAME_MISMATCH` indicates the mandate was cancelled because the payer name did not match the account holder.
        createdOn:
          format: date-time
          type: string
          description: Timestamp when the automated payment was created.
        updatedOn:
          format: date-time
          type: string
          description: Timestamp when the automated payment was last updated.
        counterparty:
          description: Counterparty linked to the automated payment instruction.
          allOf:
          - $ref: '#/components/schemas/PartnerAutomatedPaymentCounterpartyResponse'
        metadata:
          description: Partner-safe metadata associated with the automated payment counterparty.
          allOf:
          - $ref: '#/components/schemas/PartnerAutomatedPaymentCounterpartyMetadataResponse'
        payer:
          description: Payer account details reported when the automated payment was set up, when available.
          allOf:
          - $ref: '#/components/schemas/PartnerAutomatedPaymentPayerResponse'
      required:
      - id
      - type
      - accountId
      - state
      - createdOn
      - updatedOn
      - counterparty
      - metadata
