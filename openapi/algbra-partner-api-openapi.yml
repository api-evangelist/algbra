    PartnerQuestionnaireQuestionAnswer:
      type: object
      properties:
        questionKey:
          type: string
        options:
          type:
          - array
          - 'null'
          items:
            type: string
        text:
          type:
          - string
          - 'null'
      required:
      - questionKey
      - options
      - text
    PartnerComplianceCheckItem:
      type: object
      properties:
        key:
          type: object
          description: Required attribute key
          example: true
        verified:
          type: boolean
          description: Indicates where the verification result is successful
          example: true
        processType:
          type: string
          description: Indicates where a verification decision is made automatically or manually
          enum:
          - MANUAL
          - AUTOMATIC
        remarks:
          description: Additional comments about the compliance check item
          example:
          - Prospective customer provided multiple bank statements as address proof from AAA Bank and BBB Financial institution
          - The customer manually provided a passport scan after the automated check failed with the expired ID document
          type: array
          items:
            type: array
        properties:
          description: Supplementary data from the verification documents
          example:
          - key: passport_number
            value: ALG123456
          type:
          - array
          - 'null'
          items:
            type: array
        evidence:
          type:
          - array
          - 'null'
          items:
            oneOf:
            - $ref: '#/components/schemas/PartnerComplianceCheckItemEvidence'
            - $ref: '#/components/schemas/PartnerComplianceCheckItemEvidenceExternal'
      required:
      - key
      - verified
      - processType
      - remarks
    PartnerStartPersonalComplianceChecksRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartnerComplianceCheckItem'
      required:
      - items
    PartnerQuestionnaireQuestionAnswerRequest:
      type: object
      properties:
        entityId:
          type: string
          description: Unique entityId identifier (prospect or customer id)
          format: uuid
        source:
          type: string
          enum:
          - NONE
          - ONBOARDING
          - PERIODIC_REVIEW
          - CUSTOMER_TASK
        sourceId:
          type:
          - string
          - 'null'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/PartnerQuestionnaireQuestionAnswer'
      required:
      - entityId
      - source
      - sourceId
      - answers
    PartnerComplianceCheckItemEvidenceExternal:
      type: object
      properties:
        externalEvidenceId:
          type: string
          example: '123456789'
        externalProvider:
          type: string
          example: ONFIDO
      required:
      - externalEvidenceId
      - externalProvider
