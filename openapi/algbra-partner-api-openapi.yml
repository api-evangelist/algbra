openapi: 3.2.0
info:
  title: Horizon Link - API Docs Partner API
  description: ''
  version: '1.0'
  contact: {}
servers:
- url: api-url
tags:
- name: Partner
paths:
  /v1/partner/prospects/personal/questionnaire:
    get:
      operationId: PersonalProspectControllerDeprecated_getQuestionnaire
      summary: Personal prospect controller deprecated get questionnaire
      deprecated: true
      description: Will be removed
      parameters:
      - name: customerId
        required: true
        in: query
        schema:
          type: string
      - name: sourceId
        required: true
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - Partner
      x-summary-source: derived
    post:
      operationId: PersonalProspectControllerDeprecated_submitQuestionnaire
      summary: Personal prospect controller deprecated submit questionnaire
      deprecated: true
      description: Will be removed
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerQuestionnaireQuestionAnswerRequest'
      responses:
        '201':
          description: ''
      tags:
      - Partner
      x-summary-source: derived
  /v1/partner/prospects/personal/compliance/{prospectId}/start-checks:
    post:
      operationId: PersonalProspectControllerDeprecated_startComplianceChecks
      summary: Personal prospect controller deprecated start compliance checks
      deprecated: true
      description: Will be removed
      parameters:
      - name: prospectId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerStartPersonalComplianceChecksRequest'
      responses:
        '201':
          description: ''
      tags:
      - Partner
      x-summary-source: derived
