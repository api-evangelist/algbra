openapi: 3.2.0
info:
  title: Horizon Link - API Docs Onboarding Prospects - Business API
  description: ''
  version: '1.0'
  contact: {}
servers:
- url: api-url
tags:
- name: Onboarding Prospects - Business
paths:
  /v1/partner/prospects/business:
    get:
      operationId: BusinessProspectController_getBusinessProspects
      summary: Get business prospects
      parameters:
      - name: states
        required: false
        in: query
        description: List of prospects states to filter prospects. When omitted, prospects in any state are returned.
        example:
        - IDLE
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - IDLE
            - VERIFICATION_PENDING
            - PROVIDING_KYC_DATA
            - AWAITING_QUESTIONNAIRE
            - COLLECT_DOCS
            - UNDER_REVIEW
            - AWAITING_KYC_RESULT
            - KYC_FAILED
            - AWAITING_CUSTOMER_CREATION
            - ONBOARDED
            - ONBOARDING_FAILED
            - DUPLICATE_KYC_DATA
            - REJECTED
            - UNKNOWN
      - name: searchKeyword
        required: false
        in: query
        description: Search in names and emails.
        schema:
          type:
          - string
          - 'null'
      - name: page
        required: true
        in: query
        description: Page number for paginated results.
        example: 1
        schema:
          default: 1
          type: number
      - name: limit
        required: true
        in: query
        description: Number of prospects per page.
        example: 10
        schema:
          maximum: 100
          default: 10
          type: number
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: List of business prospects available to the partner
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/PartnerBusinessProspectResponse'
                    meta:
                      type: object
                      properties:
                        currentPage:
                          type: number
                          example: 1
                        itemCount:
                          type: number
                          example: 10
                        itemsPerPage:
                          type: number
                          example: 10
                        totalItems:
                          type: number
                          example: 100
                        totalPages:
                          type: number
                          example: 10
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Onboarding Prospects - Business
    post:
      operationId: BusinessProspectController_createBusinessProspect
      summary: Create business prospect
      parameters:
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreateBusinessProspectRequest'
      responses:
        '201':
          description: Creates a business prospect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerBusinessProspectDetailedResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Onboarding Prospects - Business
  /v1/partner/prospects/business/externalReference/{externalReference}:
    get:
      operationId: BusinessProspectController_getBusinessProspectByExternalId
      summary: Get business prospect by externalId
      parameters:
      - name: externalReference
        required: true
        in: path
