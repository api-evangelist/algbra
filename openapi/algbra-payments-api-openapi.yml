- name: Payments
paths:
  /v1/partner/payments/customers/{customerId}/payments/internal:
    post:
      operationId: PaymentController_createInternalPayment
      summary: Create internal payment
      parameters:
      - name: customerId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerPaymentInternalPayload'
      responses:
        '201':
          description: Returns payment id to be used in the next step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPaymentResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '404':
          description: Account Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '412':
          description: Modulus / IBAN error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPaymentErrorResponse'
      tags:
      - Payments
