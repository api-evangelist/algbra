    PartnerSimulateInboundPaymentPayload:
      type: object
      properties:
        rails:
          type: string
          default: FASTER_PAYMENTS
          description: The payment rail to simulate (e.g. Faster Payments). BACS simulates a Direct Credit or a Direct Debit, chosen by payload.type, into a ClearBank account.
          enum:
          - FASTER_PAYMENTS
          - CHAPS
          - BACS
          - INTERNAL
          - INTERNATIONAL
          example: FASTER_PAYMENTS
        payload:
          description: Simulation details specific to the selected payment rail
          oneOf:
          - $ref: '#/components/schemas/PartnerSimulateFpsPayload'
          - $ref: '#/components/schemas/PartnerSimulateInternationalPayload'
          - $ref: '#/components/schemas/PartnerSimulateBacsPayload'
      required:
      - rails
      - payload
    PartnerPaymentResponse:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
          description: Unique identifier of the payment
          example: 1489dd60-aa06-48a6-a267-e7d4a9a84200
        processingState:
          type: string
          enum:
          - CREATED
          - PROCESSING
          - SUCCESS
          - FAILURE
          description: Processing state of the payment
          example: SUCCESS
        failureReason:
          type:
          - string
          - 'null'
          enum:
          - ALREADY_PROCESS
          - AML_BLOCKED_INBOUND_TRANSFER
          - AML_BLOCKED_OUTBOUND_TRANSFER
          - EXCEEDS_LIMIT
          - INSUFFICIENT_BALANCE
          - INVALID_COUNTERPARTY
          - RAIL_NOT_SUPPORTED
          - RESTRICTED_INBOUND_TRANSFER
          - RESTRICTED_OUTBOUND_TRANSFER
          - TECHNICAL_ERROR
          - INSUFFICIENT_FUNDS
          - PAYMENT_NOT_RETURNABLE
          - DESTINATION_ACCOUNT_INVALID
          - DESTINATION_ACCOUNT_CLOSED
          - DESTINATION_ACCOUNT_BLOCKED
          - DESTINATION_NAME_MISMATCH
          - DESTINATION_DETAILS_INCORRECT
          - RETURNED_BY_DESTINATION_BANK
          - COMPLIANCE_REJECTED
          - SCHEME_ERROR
          - DUPLICATE_PAYMENT
          - CURRENCY_NOT_SUPPORTED
          - PURPOSE_NOT_SUPPORTED
          - PAYMENT_EXPIRED
          - SCHEME_CUT_OFF
          - UNDEFINED
          description: Details of the payment failure
          example: AML_BLOCKED_OUTBOUND_TRANSFER
        createdOn:
          format: date-time
          type: string
          description: Timestamp when the payment was created
        transaction:
          description: Transaction associated with the payment, if available
          allOf:
          - $ref: '#/components/schemas/PartnerTransactionResponse'
        initiationRequest:
          description: Original request payload that initiated the payment
          oneOf:
          - $ref: '#/components/schemas/PartnerPaymentInternalPayload'
          - $ref: '#/components/schemas/PartnerPaymentExternalPayload'
          - $ref: '#/components/schemas/PartnerPaymentFundingInitiatePayload'
          - $ref: '#/components/schemas/PartnerCardFundingInitiatePayload'
      required:
      - paymentId
      - processingState
      - createdOn
      - initiationRequest
    PartnerPaymentCustodyIdCounterpartyPayload:
      type: object
      properties:
        id:
          type: string
          description: External identifier
          example: A0000EXTM
      required:
      - id
    PartnerValidateCounterpartyNameCheck:
      type: object
      properties:
        assertion:
          type: string
          enum:
          - REQUIRED
          - NOT_REQUIRED
          - UNKNOWN
          description: Indicates assertion for name confirmation requirement
          example: REQUIRED
        state:
          type: string
          enum:
          - MATCH
          - PARTIAL_MATCH
          - NO_MATCH
          - BUSINESS_ACCOUNT_NAME_MATCHED
          - PERSONAL_ACCOUNT_NAME_MATCHED
          - BUSINESS_ACCOUNT_CLOSE_MATCH
