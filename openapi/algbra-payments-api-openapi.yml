    PartnerPaymentFundingInitiateResponse:
      type: object
      properties:
        paymentId:
          type: string
          description: Unique identifier of the initiated payment
          example: 1489dd60-aa06-48a6-a267-e7d4a9a84200
          format: uuid
        transaction:
          description: Transaction details if available at initiation
          allOf:
          - $ref: '#/components/schemas/PartnerTransactionResponse'
        redirectUrl:
          type: string
          description: URL to redirect the user to complete the funding process
          example: https://openbanking.examplebank.com/login/46c7a72b-ee3f-4b57-a143-7633ab76732d#token=xyz
      required:
      - paymentId
      - redirectUrl
    PartnerValidateCounterpartyPayload:
      type: object
      properties:
        identifierType:
          type: string
          description: Type of account identifier used
          enum:
          - UK_ACCOUNT
          - IBAN
          - CUSTODY_ID
          - OTHER_EXTERNAL
          - GENERIC_ACCOUNT
          example: UK_ACCOUNT
        contactName:
          type: string
          description: Full name of the counterparty contact person
          example: John Doe
        sortCode:
          type:
          - string
          - 'null'
          description: The sort code of the UK bank account
          example: '010102'
        accountNumber:
          type:
          - string
          - 'null'
          description: The account number of the UK bank account
          example: '12345678'
        iban:
          type:
          - string
          - 'null'
          description: The IBAN (International Bank Account Number) of the account
          example: GB33BUKB20201555555555
        bic:
          type:
          - string
          - 'null'
          description: The BIC (Bank Identifier Code) of the account
          example: BUKBGB22
        accountType:
          type: string
          description: Specifies the type of account
          enum:
          - BUSINESS
          - PERSONAL
          - UNKNOWN
          example: PERSONAL
        secondaryAccountId:
          type:
          - string
          - 'null'
          description: Unique identifier for a secondary account
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
      required:
      - identifierType
      - contactName
      - accountType
    PartnerPaymentVerificationMetadata:
      type: object
      properties:
        verificationType:
          type:
          - string
          - 'null'
          description: Type of verification applied.
          enum:
          - BIOMETRIC_VERIFIED
          - DEVICE_VERIFIED
          - SMS_OTP_VERIFIED
          - VOICE_OTP_VERIFIED
          - WHATSAPP_OTP_VERIFIED
          - EMAIL_OTP_VERIFIED
          - AGENT_VERIFIED
          example: SMS_OTP_VERIFIED
        verificationReference:
          type:
          - string
          - 'null'
          description: Reference identifier for the verification.
        exemptionType:
          type:
          - string
          - 'null'
          description: Exemption type applied to the payment verification.
          enum:
          - LOW_VALUE
          - NOMINATED_COUNTERPARTY
          - RECURRING_PAYMENT
          - INTERNAL_COUNTERPARTY
          - OTHER
          example: INTERNAL_COUNTERPARTY
        exemptionReason:
          type:
          - string
          - 'null'
          description: Reason for the applied exemption.
    PartnerCommonErrorResponse:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - VALIDATION_ERROR
          - FORBIDDEN
          - NOT_FOUND
          - UNAUTHORIZED
          - PRECONDITION_FAILED
          - REQUEST_TIMEOUT
          - SERVICE_UNAVAILABLE
          - UNIDENTIFIED
          - TECHNICAL_ERROR
        reason:
          type:
          - string
          - 'null'
        validationFailures:
          type:
          - array
          - 'null'
          items:
