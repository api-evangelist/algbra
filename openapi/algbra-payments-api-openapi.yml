    PartnerTransactionProgressPayload:
      type: object
      properties:
        event:
          type: string
          description: Progress event type for the transaction
          enum:
          - EXPECTED_INBOUND
          - EXPECTED_OUTBOUND
          - PLATFORM_VERIFIED
          - PAYMENT_VERIFIED
          - COMPLETED
          - CANCELLED
          example: COMPLETED
        date:
          format: date-time
          type: string
          description: Timestamp of when the event occurred
          example: '2025-01-01T10:16:49.621Z'
      required:
      - event
      - date
    PartnerTransactionTransferMetadataPayload:
      type: object
      properties:
        rails:
          type:
          - string
          - 'null'
          description: Outbound rails used for the transfer, if applicable
          enum:
          - FASTER_PAYMENTS
          - CHAPS
          - BACS
          - INTERNAL
          - INTERNATIONAL
          example: FASTER_PAYMENTS
        transactionProgress:
          description: Timeline of progress events for this transfer
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PartnerTransactionProgressPayload'
        fundingSourceProvider:
          description: Funding source provider
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentFundingSourceResponse'
        transferType:
          type: string
          enum:
          - OUTBOUND_CONTACT
          - INBOUND_PISP
          - INBOUND_LINK
          - INBOUND_RAILS
          - OUTBOUND_LINK
          - SPLIT_REQUEST
          - CUBE_TRANSFER
          - OUTBOUND_NOMINATED
          - RETURN
        returnReason:
          type: string
          enum:
          - ACCOUNT_SUSPENDED
          - INBOUND_PAYMENTS_RESTRICTED
          - PROVIDER_INITIATED
          - REFUND
          - CUBE_LOCKED_INBOUND_DISALLOWED
        returnExplanation:
          type: string
        automatedPaymentId:
          type: string
          format: uuid
        automatedPaymentType:
          type: string
          enum:
          - DIRECT_DEBIT
    PartnerPaymentFundingInitiatePayload:
      type: object
      properties:
        fundingSourceType:
          type: string
          description: Type of funding source.
          example: PISP
          enum:
          - PISP
        fundingSourceProviderId:
          type: string
          description: ID of the funding source provider.
          example: f49281c0-0840-55bd-95b3-3b46d1d0e9f1
          format: uuid
        destinationAccountId:
          type: string
          description: ID of the destination account to fund.
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
          format: uuid
        externalReference:
          type:
          - string
          - 'null'
          description: Reference identifier provided by partner.
          example: ae588135-0391-42a8-a4e4-e8e7645fa707
          format: uuid
        amount:
          type: number
          description: Amount of the funding in minor units (e.g., for £1.29 enter 129).
          example: 129
        idempotencyKey:
          type: string
          description: Idempotency key to prevent duplicate funding operations.
          example: 1483d25d-3f00-4d39-90ce-2379a130becd
          format: uuid
      required:
      - fundingSourceType
      - fundingSourceProviderId
      - destinationAccountId
      - amount
      - idempotencyKey
