    PartnerPaymentDomesticCounterpartyPayload:
      type: object
      properties:
        sortCode:
          type: string
          description: UK domestic bank sort code.
          example: '010102'
        accountNumber:
          type: string
          description: UK domestic bank account number.
          example: '12345678'
      required:
      - sortCode
      - accountNumber
    PartnerTransactionInvestmentMetadataPayload:
      type: object
      properties:
        collectionDate:
          format: date-time
          type: string
          description: Collection date
          example: '2026-03-31T16:09:33.671Z'
        placementDate:
          format: date-time
          type: string
          description: Placement date
          example: '2026-04-02T00:00:00.000Z'
        maturityDate:
          format: date-time
          type: string
          description: Maturity date
          example: '2026-10-02T12:00:00.000Z'
        settlementDate:
          format: date-time
          type: string
          description: Settlement date
          example: '2026-10-02T18:00:00.000Z'
        subscriptionId:
          type: string
          description: Subscription id
          example: add57586-1ed7-4374-9e56-c62f17fe2426
          format: uuid
        productVariantId:
          type: string
          description: Product variant id
          example: 6929c0f8a3fc67ff7fa8ecd1
        reason:
          type: string
          description: Reason
          enum:
          - COLLECTION
          - PLACEMENT
          - SETTLEMENT
          - EXPECTED_RETURN
          - CANCEL_EXPECTED_RETURN
          - ACTUAL_RETURN
          example: COLLECTION
        returns:
          type: number
          description: Expected return amount in minor units (e.g. 129 for £1.29)
          example: 129
      required:
      - collectionDate
      - placementDate
      - maturityDate
      - settlementDate
      - subscriptionId
      - productVariantId
      - reason
      - returns
    PartnerCardTransactionPos:
      type: object
      properties:
        panEntryMode:
          type: string
          description: Primary Account Number entry mode
          example: CHIP
        pinEntryMode:
          type: string
          description: PIN entry mode
          example: ENTERED
        cardPresent:
          type: boolean
          description: Indicates if the card was physically present
          example: true
        pinPresent:
          type: boolean
          description: Indicates if PIN was entered
          example: false
        partialApprovalCapable:
          type: boolean
          description: Indicates if partial approval is capable
          example: false
        purchaseAmountOnly:
          type: boolean
          description: Indicates if this is purchase amount only
          example: true
        isRecurring:
          type: boolean
          description: Indicates if this is a recurring transaction
          example: false
        isInstallment:
          type: boolean
          description: Indicates if this is an installment transaction
          example: false
        cardHolderPresent:
          type: boolean
          description: Indicates if cardholder was present
          example: true
        countryCode:
          type: string
          description: Country code (ISO 3166-1 alpha-2)
          example: GB
        postCode:
          type: string
          description: Postal code
          example: SW1A 1AA
        terminalAttendence:
          type: string
          description: Terminal attendance indicator
          example: ATTENDED
        terminalId:
          type: string
          description: Terminal identifier
          example: TERM001
        terminalLocation:
          type: string
          description: Terminal location
          example: IN_STORE
    PartnerPaymentExternalPayload:
      type: object
      properties:
        sourceAccountId:
          type: string
          description: Source account id from which payment is sent
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
          format: uuid
        destinationCounterparty:
          description: Counterparty details of the payment destination
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentReferenceCounterpartyPayload'
        idempotencyKey:
          type: string
          description: Unique key to ensure idempotency of payment requests
          example: 1483d25d-3f00-4d39-90ce-2379a130becd
          format: uuid
        amount:
          type: number
          description: Amount in minor units (e.g. for £1.29 enter 129)
          example: 129
        externalReference:
          type:
          - string
          - 'null'
          description: Reference identifier provided by partner.
          example: ae588135-0391-42a8-a4e4-e8e7645fa707
          format: uuid
        description:
          type:
          - string
          - 'null'
          description: Description of the payment
          example: Sent from Algbra
          maxLength: 140
        rails:
          type:
          - string
          - 'null'
          default: FASTER_PAYMENTS
          description: The payment rail to use (e.g. Faster Payments)
          enum:
          - FASTER_PAYMENTS
          - CHAPS
          - BACS
          - INTERNAL
          - INTERNATIONAL
          example: FASTER_PAYMENTS
        railsPolicy:
          type:
          - string
          - 'null'
          default: DETECT
          description: Policy for determining which rail to use
          enum:
          - FIXED
          - DETECT
        verificationMetadata:
          description: Metadata required to verify the payment request
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentVerificationMetadata'
        purpose:
          type:
          - string
          - 'null'
          description: Purpose of the payment
          example: PAY_INVOICE
          enum:
          - UNKNOWN
          - PAYING_FAMILY_OR_FRIEND
          - TRANSFER_OWN_OTHER_BANK_ACCOUNT
          - BUY_SOMETHING
          - PAY_INVOICE
          - SALARY_OR_WAGES
          - GOVERNMENT_PAYMENT
          - TAX_PAYMENT
          - LOAN_REPAYMENT
          - BUYING_HOME_OR_PAYING_SOLICITOR
          - PAYING_BUILDER_OR_TRADESPERSON
          - INVESTMENTS
          - PAYING_RENT
          - CHARITABLE_DONATION
          - OTHER
          - REFUND
          - TREASURY_PAYMENT
          - TREASURY_NETTING
          - CARD_SCHEME_SETTLEMENT
          - GENERIC_FEES
          - SAVINGS_PAYMENT
          - GIFT_PAYMENT
        ultimateSourceCounterparty:
          description: Ultimate source counterparty details of the payment
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentReferenceCounterpartyPayload'
        ultimateDestinationCounterparty:
          description: Ultimate destination counterparty details of the payment
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentReferenceCounterpartyPayload'
      required:
      - sourceAccountId
      - destinationCounterparty
      - idempotencyKey
      - amount
      - verificationMetadata
