    PartnerCardTransactionScheme:
      type: object
      properties:
        network:
          type: string
          description: Network name (e.g., MasterCard, Visa)
          example: MasterCard
        binPrefix:
          type: string
          description: Bank Identification Number prefix
          example: '5432'
        referenceId:
          type: string
          description: Reference identifier for the scheme
          example: ref123
    PartnerSimulateFpsPayload:
      type: object
      properties:
        sourceCounterparty:
          description: Counterparty details for the payment source
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentReferenceCounterpartyPayload'
        destinationFiatAccountId:
          type: string
          description: Account id of the destination account which receiving the payment
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
          format: uuid
        amount:
          type: number
          description: Amount in minor units (e.g. for £1.29 enter 129)
          example: 129
        reference:
          type:
          - string
          - 'null'
          description: Description of the payment
          example: Sent from Algbra
          maxLength: 140
      required:
      - destinationFiatAccountId
      - amount
    PartnerTransactionCardMetadataPayload:
      type: object
      properties:
        phase:
          type: string
          description: Phase of the card transaction.
          example: AUTHORIZATION
          enum:
          - AUTHORIZATION
          - INCREMENTAL
          - ADVICE
          - REVERSAL
          - EXPIRATION_REVERSAL
          - CLEARING
          - FORCE_CLEARING
        type:
          type: string
          description: Type of the card transaction. Optional but recommended for accurate reference generation.
          example: CARD_PAYMENT
          enum:
          - ACTIVE_CARD_CHECK
          - CARD_PAYMENT
          - REFUND
          - ATM_WITHDRAWAL
          - ORIGINAL_CREDIT
          - CASHBACK
          - QUASI_CASH
        cardToken:
          type: string
          description: Unique reference for the card.
          example: 1483d25d-3f00-4d39-90ce-2379a130becd
          format: uuid
        transactionToken:
          type: string
          description: Unique reference for the card transaction, to logically group multiple events.
          example: 1483d25d-3f00-4d39-90ce-2379a130becd
          format: uuid
        eventToken:
          type: string
          description: Unique reference for the card event.
          example: 1483d25d-3f00-4d39-90ce-2379a130becd
          format: uuid
        lastDigits:
          type: string
          description: Last 4 digits of the card.
          example: '1234'
          pattern: ^[0-9]{4}$
        scheme:
          description: Card transaction scheme information (network, bin prefix, etc.).
          example:
            network: MasterCard
            binPrefix: '5432'
            referenceId: ref123
          allOf:
          - $ref: '#/components/schemas/PartnerCardTransactionScheme'
        cardAcceptor:
          description: Card acceptor information (merchant details).
          example:
            mcc: '5411'
            name: Supermarket
            city: London
            country: GB
          allOf:
          - $ref: '#/components/schemas/PartnerCardTransactionAcceptor'
        pos:
          description: Point of sale information.
          example:
            cardPresent: true
            pinPresent: false
            terminalId: TERM001
          allOf:
          - $ref: '#/components/schemas/PartnerCardTransactionPos'
        merchant:
          description: Merchant information.
          example:
            name: Tesco
            summary: Hyper-Supermarket
            imageUrl: https://s3.eu-central-1.amazonaws.com/files.node-prod.dateio.cz/m/538VqZ4gn33tVJJWEYa8d3/l
            location:
              latitude: 51.46358
              longitude: -0.1861
          allOf:
          - $ref: '#/components/schemas/PartnerTransactionMerchantPayload'
      required:
      - phase
      - transactionToken
      - eventToken
      - lastDigits
    PartnerSimulateInternationalPayload:
      type: object
      properties:
        sourceCounterparty:
          description: Counterparty details for the payment source
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentReferenceCounterpartyPayload'
        destinationFiatAccountId:
          type: string
          description: Account id of the destination account which receiving the payment
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
          format: uuid
        amount:
          type: number
          description: Amount in minor units (e.g. for £1.29 enter 129)
          example: 129
        reference:
          type:
          - string
          - 'null'
          description: Description of the payment
          example: Sent from Algbra
          maxLength: 140
      required:
      - destinationFiatAccountId
      - amount
    PartnerPaymentFundingSourceResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the funding source
          example: f49281c0-0840-55bd-95b3-3b46d1d0e9f1
          format: uuid
        name:
          type: string
          description: Display name of the funding source
          example: John Doe
        type:
          type: string
          enum:
          - PISP
          description: Type of funding source
          example: PISP
        logo:
          type:
          - string
          - 'null'
          description: Logo URL representing the funding source
          example: https://app-static.algbra.com/banklogo/mock-payments-gb-redirect.png
      required:
      - id
      - name
      - type
    PartnerSimulateBacsPayload:
      type: object
      properties:
        type:
          type: string
          enum:
          - DIRECT_CREDIT
          - DIRECT_DEBIT
          description: DIRECT_CREDIT credits the account. DIRECT_DEBIT collects from it under the mandate given in automatedPaymentId.
          example: DIRECT_CREDIT
        destinationFiatAccountId:
          type: string
          description: Account id of the destination account which receiving the payment
          example: e0cab2dd-739f-43de-b131-3e423e935bf1
          format: uuid
        amount:
          type: number
          description: Amount in minor units (e.g. for £1.29 enter 129)
          minimum: 1
          maximum: 99999999999
          example: 15000
        reference:
          type: string
          description: 'Reference of the BACS item: uppercase letters, numbers, period, ampersand, forward slash, hyphen and space. Generated when omitted.'
          maxLength: 18
          example: SALARY OCT
        sourceCounterparty:
          description: DIRECT_CREDIT only. The originator (payer), a UK account. Defaults to a test originator the ClearBank simulator accepts.
          allOf:
          - $ref: '#/components/schemas/PartnerPaymentReferenceCounterpartyPayload'
        serviceUserNumber:
          type: string
          description: DIRECT_CREDIT only. BACS service user number of the originator.
          minLength: 6
          maxLength: 6
          default: '400000'
          example: '400000'
        automatedPaymentId:
          type: string
          description: DIRECT_DEBIT only, and required for it. The mandate the collection is made under; its originator and service user number are used.
          format: uuid
      required:
      - type
      - destinationFiatAccountId
      - amount
    PartnerTransactionMerchantLocationPayload:
      type: object
      properties:
        latitude:
          type: string
          description: Latitude
          example: '51.46358'
        longitude:
          type: string
          description: Longitude
          example: '-0.1861'
      required:
      - latitude
      - longitude
