    PartnerPersonalProspectDueDiligenceInfo:
      type: object
      properties:
        clear:
          type: string
          enum:
          - VERIFIED
          - FAILED
        details:
          $ref: '#/components/schemas/PartnerPersonalProspectDueDiligenceDetails'
