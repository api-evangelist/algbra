openapi: 3.2.0
info:
  title: Horizon Link - API Docs Compliance API
  description: ''
  version: '1.0'
  contact: {}
servers:
- url: api-url
tags:
- name: Compliance
paths:
  /v1/partner/compliance/due-diligence/questionnaire:
    get:
      operationId: DueDiligenceController_getQuestionnaire
      summary: Get questionnaire for a applicant
      description: Retrieves the compliance questionnaire associated with applicant. Fails if the applicant is not ready for questionnaire.
      parameters:
      - name: entityId
        required: true
        in: query
        description: Unique entity identifier (prospectId or customerId)
        schema:
          type: string
      - name: sourceId
        required: false
        in: query
        description: Source Id of the questionnaire
        schema:
          type: string
      - name: source
        required: false
        in: query
        description: Source of the questionnaire
        schema:
          enum:
          - NONE
          - ONBOARDING
          - PERIODIC_REVIEW
          - CUSTOMER_TASK
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: Questionnaire successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerQuestionnaireResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '406':
          description: Applicant not ready for questionnaire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Compliance
    post:
      operationId: DueDiligenceController_submitQuestionnaire
      summary: Submit questionnaire for applicant
      description: Retrieves the compliance questionnaire associated with applicant. Fails if the applicant is not ready for questionnaire.
      parameters:
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerQuestionnaireQuestionAnswerRequest'
      responses:
        '200':
          description: Questionnaire successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerQuestionnaireResponse'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '406':
          description: Applicant not ready for questionnaire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Compliance
  /v1/partner/compliance/due-diligence/{prospectId}/upload-evidence/{externalEvidenceId}:
    post:
      operationId: DueDiligenceController_uploadEvidence
      summary: Upload evidence file
      parameters:
      - name: prospectId
        required: true
        in: path
        schema:
          type: string
      - name: externalEvidenceId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Upload evidence file.
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Compliance
  /v1/partner/compliance/due-diligence/{prospectId}/onboarding-checks:
    get:
      operationId: DueDiligenceController_getOnboardingChecks
      summary: Get compliance checks details for personal prospect
      parameters:
      - name: prospectId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      responses:
        '200':
          description: Start compliance checks for personal prospect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPersonalProspectDueDiligenceInfo'
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Compliance
  /v1/partner/compliance/due-diligence/{prospectId}/start-onboarding-checks:
    post:
      operationId: DueDiligenceController_startComplianceChecks
      summary: Start compliance checks personal prospect
      parameters:
      - name: prospectId
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        in: header
        description: Authorization header containing your API Token
        schema:
          type: string
      - name: x-alg-nonce
        in: header
        description: Nonce used to generate the payload signature
        schema:
          type: string
      - name: x-alg-signature
        in: header
        description: Payload signature
        schema:
          type: string
      - name: date
        in: header
        description: Date of the request un UTC/GMT
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerStartPersonalComplianceChecksRequest'
      responses:
        '200':
          description: Start compliance checks for personal prospect.
        '400':
          description: Input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCommonErrorResponse'
      tags:
      - Compliance
