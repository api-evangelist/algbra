      type: object
      properties:
        questions:
          $ref: '#/components/schemas/PartnerQuestionnaireQuestionResponse'
        answers:
          allOf:
          - $ref: '#/components/schemas/PartnerQuestionnaireQuestionAnswerResponse'
      required:
      - questions
      - answers
    PartnerDueDiligenceItem:
      type: object
      properties:
        required:
          type: boolean
        valid:
          type:
          - boolean
          - 'null'
        attributes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PartnerDueDiligenceItemAttributeDetail'
      required:
      - required
      - attributes
    QuestionnaireQuestionOption:
      type: object
      properties:
        key:
          type: object
        text:
          type: string
        value:
          type:
          - object
          - 'null'
        inputType:
          type:
          - string
          - 'null'
          enum:
          - NUMBER
          - TEXT
        hidden:
          type:
          - boolean
          - 'null'
      required:
      - key
      - text
      - value
      - inputType
    PartnerQuestionnaireQuestionAnswer:
      type: object
      properties:
        questionKey:
          type: string
        options:
          type:
          - array
          - 'null'
          items:
            type: string
        text:
          type:
          - string
          - 'null'
      required:
      - questionKey
      - options
      - text
    PartnerCommonErrorResponse:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - VALIDATION_ERROR
          - FORBIDDEN
          - NOT_FOUND
          - UNAUTHORIZED
          - PRECONDITION_FAILED
          - REQUEST_TIMEOUT
          - SERVICE_UNAVAILABLE
          - UNIDENTIFIED
          - TECHNICAL_ERROR
        reason:
          type:
          - string
          - 'null'
        validationFailures:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PartnerValidationFieldError'
      required:
      - errorType
    PartnerQuestionnaireQuestionResponse:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - CHECKBOX
          - RADIO
          - TEXT
          - MULTI_LINE_TEXT
          - COUNTRY_PICKER
          - TAX_RESIDENCY
        options:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/QuestionnaireQuestionOption'
        maxSelection:
          type:
          - number
          - 'null'
        optional:
          type:
          - boolean
          - 'null'
      required:
      - key
      - title
      - description
      - type
      - options
      - maxSelection
      - optional
    PartnerComplianceCheckItem:
      type: object
      properties:
        key:
          type: object
          description: Required attribute key
          example: true
        verified:
          type: boolean
          description: Indicates where the verification result is successful
          example: true
        processType:
          type: string
          description: Indicates where a verification decision is made automatically or manually
          enum:
          - MANUAL
          - AUTOMATIC
        remarks:
          description: Additional comments about the compliance check item
          example:
          - Prospective customer provided multiple bank statements as address proof from AAA Bank and BBB Financial institution
          - The customer manually provided a passport scan after the automated check failed with the expired ID document
          type: array
          items:
            type: array
        properties:
          description: Supplementary data from the verification documents
          example:
          - key: passport_number
            value: ALG123456
          type:
          - array
          - 'null'
          items:
            type: array
        evidence:
          type:
          - array
          - 'null'
          items:
            oneOf:
            - $ref: '#/components/schemas/PartnerComplianceCheckItemEvidence'
            - $ref: '#/components/schemas/PartnerComplianceCheckItemEvidenceExternal'
      required:
      - key
      - verified
      - processType
      - remarks
    PartnerStartPersonalComplianceChecksRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartnerComplianceCheckItem'
      required:
      - items
    PartnerQuestionnaireQuestionAnswerRequest:
      type: object
      properties:
        entityId:
          type: string
          description: Unique entityId identifier (prospect or customer id)
          format: uuid
        source:
          type: string
          enum:
          - NONE
          - ONBOARDING
          - PERIODIC_REVIEW
          - CUSTOMER_TASK
        sourceId:
          type:
          - string
          - 'null'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/PartnerQuestionnaireQuestionAnswer'
      required:
      - entityId
      - source
      - sourceId
      - answers
    PartnerComplianceCheckItemEvidenceExternal:
      type: object
      properties:
        externalEvidenceId:
          type: string
          example: '123456789'
        externalProvider:
          type: string
          example: ONFIDO
      required:
      - externalEvidenceId
      - externalProvider
    PartnerDueDiligenceItemAttributeDetail:
      type: object
      properties:
        key:
          type: string
          enum:
          - PEP
          - SANCTION
          - ADVERSE_MEDIA
          - COUNTRY_OF_RESIDENCE
          - ID_DOCUMENT
          - NATIONALITY
          - PLACE_OF_BIRTH
          - ANTI_IMPERSONATION
          - LEGAL_WARNINGS
          - AUTO_KYC_RESOLUTION
          - RISK_SCORE_OVERRIDE
          - RISK_SCORE_CALCULATED
          - EXPECTED_ANNUAL_INCOME
          - NFD
          - INTELLIGENCE
        valid:
          type: boolean
        available:
          type: boolean
        input:
          type: string
          enum:
          - REQUIRED
          - OPTIONAL
        informative:
          type: boolean
          description: When true, this attribute is informative only and processed internally by the platform.
      required:
      - key
      - valid
      - available
      - input
      - informative
    PartnerQuestionnaireQuestionAnswerResponse:
      type: object
      properties:
        questionnaireKey:
          type: string
        questionKey:
          type: string
        options:
          type:
          - array
          - 'null'
          items:
            type: string
        text:
          type:
          - string
          - 'null'
      required:
      - questionnaireKey
      - questionKey
      - options
      - text
