      - clear
      - details
    PartnerPersonalProspectDueDiligenceDetails:
      type: object
      properties:
        ADDRESS_PROOF:
          $ref: '#/components/schemas/PartnerDueDiligenceItem'
        ANTI_IMPERSONATION:
          $ref: '#/components/schemas/PartnerDueDiligenceItem'
        FUND_PROOF:
          $ref: '#/components/schemas/PartnerDueDiligenceItem'
        ID_PROOF:
          $ref: '#/components/schemas/PartnerDueDiligenceItem'
        PROOF_OF_MEDIA_SCREENING:
          $ref: '#/components/schemas/PartnerDueDiligenceItem'
        LEGAL_WARNINGS_EXPLANATION:
          $ref: '#/components/schemas/PartnerDueDiligenceItem'
        BACKGROUND_CHECK:
          $ref: '#/components/schemas/PartnerDueDiligenceItem'
        SANCTION:
          $ref: '#/components/schemas/PartnerDueDiligenceItem'
