name: Algbra
kind: company
description: >-
  Algbra is a UK values-based, sustainability-focused fintech operated by
  Algbra FS UK Limited (company number 12629086), an electronic money institution
  authorised by the Financial Conduct Authority under the Electronic Money Regulations
  2011 (FRN 952360); its parent, Algbra Group Limited, is a certified B Corporation.
  Rather than a licensed clearing bank or building society, Algbra is a challenger
  provider of ethical multi-currency accounts, cards, savings and Banking-as-a-Service
  infrastructure. Through the Algbra Labs developer platform it exposes two API
  surfaces - a first-party Partner Banking (BaaS) API for onboarding, accounts,
  cards, payments and transactions, and a UK Open Banking dedicated interface
  conformant to the Open Banking Implementation Entity (OBIE) Read/Write Standard
  v3.1.8 covering Account & Transaction Information (AIS), Payment Initiation (PIS) and
  Confirmation of Funds (CBPII), delivered via the Tell Money (Tell Connect)
  platform. As a non-CMA9 ASPSP it meets PSD2 access-to-account obligations, securing
  the interface with FAPI-grade OAuth2/OIDC, mutual-TLS using OBIE OBWAC/OBSEAL
  eIDAS certificates, PS256 request-object signing, Dynamic Client Registration
  (DCR v3.2) and PSD2 strong customer authentication.
