- aid: algbra:algbra-partner-banking-api
  name: Algbra Partner Banking API
  description: >-
    Algbra Labs' first-party Partner Banking (Banking-as-a-Service) API for B2B
    partners, covering customer onboarding and compliance checks, primary and
    virtual accounts, card issuing, internal/inbound/outbound and automated
    payments, counterparty validation, transactions, activity feeds, investments
    and webhooks. Secured with API keys, mTLS and payload signing over IP-whitelisted
    hosts (Shared/Isolated Tenancy or Standalone deployment).
  humanURL: https://developer.algbralabs.com/partner-banking/introduction
