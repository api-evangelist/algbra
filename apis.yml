- aid: algbra:algbra-confirmation-of-funds-api
  name: Algbra Confirmation of Funds API (CBPII)
  description: >-
    Algbra's UK Open Banking Confirmation of Funds (CBPII) dedicated interface under
    the OBIE Read/Write Standard v3.1.8, allowing authorised CBPII Third Party
    Providers to confirm the availability of funds (scope 'fundsconfirmations').
    Documented as part of Algbra's OBIE-conformant interface; secured with FAPI
    OAuth2/OIDC, mTLS and PSD2 SCA.
  humanURL: https://developer.algbralabs.com/open-banking-uk/introduction
