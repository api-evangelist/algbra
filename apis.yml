apis:
- aid: algbra:algbra-account-transaction-api
  name: Algbra Account and Transaction Information API (AIS)
  description: >-
    Algbra's UK Open Banking Account & Transaction Information (AIS) dedicated
    interface, conformant to the OBIE Read/Write Standard v3.1, enabling authorised
    AISP Third Party Providers to create account-access consents and read accounts,
    balances, beneficiaries and transactions with the customer's consent. Delivered
    via the Tell Money (Tell Connect) platform; FAPI OAuth2/OIDC + mTLS + PSD2 SCA.
  humanURL: https://developer.algbralabs.com/open-banking-uk/introduction
  baseURL: https://secure.tell.systems/algbra/open-banking/v3.1/aisp
