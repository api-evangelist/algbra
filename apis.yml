- aid: algbra:algbra-payment-initiation-api
  name: Algbra Payment Initiation API (PIS)
  description: >-
    Algbra's UK Open Banking Payment Initiation (PIS) dedicated interface under the
    OBIE Read/Write Standard v3.1.8, allowing authorised PISP Third Party Providers
    to initiate payments on a customer's behalf (scope 'payments'). Documented as
    part of Algbra's OBIE-conformant interface; secured with FAPI OAuth2/OIDC, mTLS
    and PSD2 SCA. No first-party OpenAPI is published separately from the OBIE
    standard specification.
  humanURL: https://developer.algbralabs.com/open-banking-uk/introduction
  baseURL: https://secure.tell.systems/algbra/open-banking/v3.1/pisp
